name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      - name: Install Lightpanda (pinned) for the browser tests
        run: |
          curl -fsSL -o lightpanda https://github.com/lightpanda-io/browser/releases/download/1.0.3/lightpanda-x86_64-linux
          echo "53eb34da09159dcf8f04865dbfe3e63e9a652062684495aa7ced5ddd7c82e8b0  lightpanda" | sha256sum -c -
          chmod +x lightpanda
          echo "LIGHTPANDA_BIN=$PWD/lightpanda" >> "$GITHUB_ENV"
      - name: Run tests
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
